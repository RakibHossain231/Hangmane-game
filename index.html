<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hangman · Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <h1>🔤 HANGMAN</h1>
            <div class="counter" id="wrongCount">❌0/6</div>
        </div>

        <!-- Hangman Drawing - SVG Container -->
        <div class="drawing-area">
            <div id="hangmanContainer" class="hangman-svg">
                <!-- SVG will be injected here -->
            </div>
        </div>

        <!-- Word Display -->
        <div class="word-area">
            <div id="wordDisplay" class="word-letters"></div>
            <div class="word-info" id="wordLength"></div>
        </div>

        <!-- Hint & Guessed Letters -->
        <div class="hint-row">
            <div class="hint-bubble">
                <span class="hint-icon">💡</span>
                <span id="hintText" class="hint-text">hint</span>
            </div>
            <div class="guessed-bubble" id="guessedLetters">⚡</div>
        </div>

        <!-- Message -->
        <div class="message-mini" id="messageDisplay">guess a letter</div>

        <!-- QWERTY Keyboard -->
        <div class="keyboard-container">
            <div class="keyboard-row" id="row1"></div>
            <div class="keyboard-row" id="row2"></div>
            <div class="keyboard-row" id="row3"></div>
        </div>

        <!-- Restart Button -->
        <button class="restart-mini" id="restartButton">⟳ new word</button>
        <!-- Footer-->
        <div class="footer">
            <span class="powered">⚡ powered by</span>
            <span class="credit">Rakib</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
